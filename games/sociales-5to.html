<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sociales 5to - Mateo</title>
<style>
  :root { --bg:#0b1220; --card:#152238; --y:#fbbf24; --g:#22c55e; --r:#f87171; --t:#f1f5f9; --m:#94a3b8; --a:#38bdf8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; background: #0b1220; color: var(--t); min-height: 100vh; padding: 16px; }
  .w { max-width: 640px; margin: 0 auto; }
  a.back { color: var(--a); font-weight: 700; text-decoration: none; }
  h1 { font-size: 1.4rem; margin: 8px 0 16px; }
  .hud { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 1.4rem; color: var(--y); }
  .stat span { font-size: 0.7rem; color: var(--m); text-transform: uppercase; }
  .bar { height: 8px; background: #334155; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--a), var(--y)); transition: width .25s; }
  .card { background: var(--card); border: 1px solid #334155; border-radius: 16px; padding: 18px; }
  .meta { color: var(--m); font-size: 0.85rem; margin-bottom: 10px; font-weight: 600; }
  .meta .retry { color: var(--r); }
  .q { font-size: 1.2rem; font-weight: 800; line-height: 1.35; margin: 0 0 14px; }
  .opts { display: grid; gap: 8px; }
  button.opt { text-align: left; padding: 14px; border-radius: 12px; border: 2px solid #475569; background: #0b1220; color: var(--t); font-size: 1rem; cursor: pointer; }
  button.opt:hover:not(:disabled) { border-color: var(--a); }
  button.opt:disabled { cursor: default; }
  button.opt.ok { border-color: var(--g); background: rgba(20,83,45,.35); }
  button.opt.bad { border-color: var(--r); background: rgba(127,29,29,.3); }
  .fb { min-height: 1.5em; margin-top: 12px; font-weight: 700; }
  .fb.ok { color: var(--g); } .fb.bad { color: var(--r); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn { background: var(--y); color: #0b1220; border: 0; font-weight: 900; padding: 12px 18px; border-radius: 12px; font-size: 1rem; cursor: pointer; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .done { text-align: center; display: none; }
  .done.show { display: block; }
  .play.hide { display: none; }
  .err { background: #7f1d1d; padding: 12px; border-radius: 8px; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
<div class="w">
  <a class="back" href="../index.html">&larr; Juegos</a>
  <h1>Sociales 5to</h1>
  <div class="err" id="err"></div>
  <div class="hud">
    <div class="stat"><b id="pts">0</b><span>Puntos</span></div>
    <div class="stat"><b id="streak">0</b><span>Racha</span></div>
    <div class="stat"><b id="left">0</b><span>Por dominar</span></div>
  </div>
  <div class="bar"><i id="prog"></i></div>

  <div class="card play" id="play">
    <div class="meta" id="meta">Cargando...</div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="row">
      <span id="hint" style="color:var(--m);font-size:0.85rem"></span>
      <button class="btn" id="next" disabled>Siguiente</button>
    </div>
  </div>

  <div class="card done" id="done">
    <h2 style="color:var(--y);margin-top:0">Campeon, Mateo!</h2>
    <p id="final"></p>
    <p style="color:var(--m)">Record: <b id="best" style="color:var(--y)">0</b> pts</p>
    <button class="btn" id="again">Jugar otra vez</button>
  </div>
</div>
<script>
(function () {
  try {
    var NEED = 2;
    var KEY = "mateo-sociales-5to-v2";
    var BANK = [
      { id: "pc", q: "Que es participacion ciudadana?", a: "La manera de tomar decisiones en la comunidad", opts: ["Solo pagar impuestos", "La manera de tomar decisiones en la comunidad", "Viajar a otros paises", "Jugar en el celular"] },
      { id: "pat", q: "Que es patrimonio cultural?", a: "La herencia que recibimos de nuestros antepasados", opts: ["Solo dinero del banco", "La herencia que recibimos de nuestros antepasados", "Un tipo de impuesto", "Una app de mapas"] },
      { id: "id", q: "Que es identidad?", a: "El conjunto de rasgos que caracterizan a una persona", opts: ["El conjunto de rasgos que caracterizan a una persona", "Solo tu nombre", "Tu numero de telefono", "Una foto de Instagram"] },
      { id: "ej", q: "Ejemplo de patrimonio cultural de Puerto Rico:", a: "Baile de bomba (o mofongo)", opts: ["Baile de bomba (o mofongo)", "Un videojuego nuevo", "Una tarjeta de credito", "Un presupuesto"] },
      { id: "et", q: "Las 3 etapas del intercambio comercial son:", a: "Trueque, monedas/billetes, tarjetas", opts: ["Comprar, vender, regalar", "Trueque, monedas/billetes, tarjetas", "Ahorrar, gastar, pedir", "Lunes, martes, miercoles"] },
      { id: "fp", q: "Que son las finanzas personales?", a: "Manejo del presupuesto, ahorrar y decisiones de dinero", opts: ["Solo el sueldo del gobierno", "Manejo del presupuesto, ahorrar y decisiones de dinero", "Comprar sin pensar", "Trueque entre amigos"] },
      { id: "em", q: "Un emprendedor es:", a: "Una persona que inicia y pone en marcha un proyecto", opts: ["Alguien que solo ahorra", "Una persona que inicia y pone en marcha un proyecto", "Un ciudadano digital", "Un tipo de cooperativa"] },
      { id: "co", q: "Una cooperativa es:", a: "Personas que trabajan juntas por un objetivo en comun", opts: ["Una tienda de videojuegos", "Personas que trabajan juntas por un objetivo en comun", "Solo un banco", "Un impuesto"] },
      { id: "ec", q: "La economia estudia:", a: "Produccion y distribucion de bienes y servicios", opts: ["Solo el clima", "Produccion y distribucion de bienes y servicios", "Como votar a los 18", "Patrimonio cultural"] },
      { id: "ah", q: "Ahorrar significa:", a: "Guardar parte del dinero para usarlo en el futuro", opts: ["Gastar todo hoy", "Guardar parte del dinero para usarlo en el futuro", "Pedir prestado siempre", "Hacer trueque"] },
      { id: "cd", q: "Que es ciudadania digital?", a: "Normas y principios para usar bien la tecnologia", opts: ["Solo tener celular", "Normas y principios para usar bien la tecnologia", "No usar internet nunca", "Comprar online sin pensar"] },
      { id: "vo", q: "A que edad pueden votar los ciudadanos puertorriquenos?", a: "18 anos", opts: ["12 anos", "16 anos", "18 anos", "21 anos"] },
      { id: "tf1", q: "Cierto o Falso: La participacion social NO es una responsabilidad ciudadana.", a: "Falso", opts: ["Cierto", "Falso"] },
      { id: "tf2", q: "Cierto o Falso: El Viejo San Juan es un ejemplo de patrimonio cultural.", a: "Cierto", opts: ["Cierto", "Falso"] },
      { id: "tf3", q: "Cierto o Falso: El trueque es un instrumento moderno de la economia actual.", a: "Falso", opts: ["Cierto", "Falso"] },
      { id: "tf4", q: "Cierto o Falso: El presupuesto es el plan de cuanto dinero se recibe y cuanto se gasta.", a: "Cierto", opts: ["Cierto", "Falso"] },
      { id: "tf5", q: "Cierto o Falso: El cooperativismo se basa en el trabajo mutuo y la igualdad.", a: "Cierto", opts: ["Cierto", "Falso"] }
    ];

    var mastery = {};
    var pts = 0;
    var streak = 0;
    var queue = [];
    var cur = null;
    var answered = false;
    var total = BANK.length;
    var wasWrong = false;

    function $(id) { return document.getElementById(id); }
    function shuffle(a) {
      var b = a.slice();
      for (var i = b.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = b[i]; b[i] = b[j]; b[j] = t;
      }
      return b;
    }
    function getBest() {
      try {
        var d = JSON.parse(localStorage.getItem(KEY) || "{}");
        return d.best || 0;
      } catch (e) { return 0; }
    }
    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify({ pts: pts, best: Math.max(pts, getBest()), mastery: mastery }));
      } catch (e) {}
    }
    function remaining() {
      var n = 0;
      for (var i = 0; i < BANK.length; i++) {
        if ((mastery[BANK[i].id] || 0) < NEED) n++;
      }
      return n;
    }
    function updateHud() {
      $("pts").textContent = String(pts);
      $("streak").textContent = String(streak);
      $("left").textContent = String(remaining());
      var done = total - remaining();
      $("prog").style.width = (100 * done / total) + "%";
    }
    function buildQueue() {
      queue = [];
      for (var i = 0; i < BANK.length; i++) {
        if ((mastery[BANK[i].id] || 0) < NEED) queue.push(BANK[i]);
      }
      queue = shuffle(queue);
    }
    function finish() {
      $("play").classList.add("hide");
      $("done").classList.add("show");
      var best = Math.max(pts, getBest());
      try {
        localStorage.setItem(KEY, JSON.stringify({ pts: pts, best: best, mastery: mastery }));
      } catch (e) {}
      $("final").textContent = "Puntos finales: " + pts + ". Todas las preguntas dominadas (2 bien seguidas cada una).";
      $("best").textContent = String(best);
      updateHud();
    }
    function showQ() {
      answered = false;
      $("next").disabled = true;
      $("fb").textContent = "";
      $("fb").className = "fb";
      $("hint").textContent = "";
      if (remaining() === 0) { finish(); return; }
      if (queue.length === 0) buildQueue();
      if (queue.length === 0) { finish(); return; }
      cur = queue.shift();
      var m = mastery[cur.id] || 0;
      if (wasWrong || m > 0) {
        $("meta").innerHTML = '<span class="retry">Repaso (hay que aprenderla)</span> · falta ' + (NEED - m) + ' bien';
      } else {
        $("meta").textContent = "Nueva · gana +10 pts";
      }
      wasWrong = false;
      $("q").textContent = cur.q;
      var box = $("opts");
      box.innerHTML = "";
      var opts = shuffle(cur.opts);
      for (var i = 0; i < opts.length; i++) {
        (function (o) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "opt";
          b.textContent = o;
          b.onclick = function () { pick(o, b); };
          box.appendChild(b);
        })(opts[i]);
      }
      updateHud();
    }
    function pick(choice, btn) {
      if (answered) return;
      answered = true;
      var nodes = $("opts").querySelectorAll("button.opt");
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].disabled = true;
        if (nodes[i].textContent === cur.a) nodes[i].classList.add("ok");
      }
      var fb = $("fb");
      if (choice === cur.a) {
        btn.classList.add("ok");
        mastery[cur.id] = (mastery[cur.id] || 0) + 1;
        var bonus = streak >= 2 ? 5 : 0;
        pts += 10 + bonus;
        streak += 1;
        fb.textContent = bonus ? ("Bien! +" + (10 + bonus) + " (racha)") : "Bien! +10 pts";
        fb.className = "fb ok";
        if ((mastery[cur.id] || 0) < NEED) {
          queue.push(cur);
          $("hint").textContent = "Una mas bien y esta queda dominada.";
        } else {
          $("hint").textContent = "Dominada!";
        }
      } else {
        btn.classList.add("bad");
        mastery[cur.id] = 0;
        streak = 0;
        pts = Math.max(0, pts - 2);
        fb.textContent = "Incorrecto. Correcta: " + cur.a;
        fb.className = "fb bad";
        $("hint").textContent = "Vuelve pronto: hay que aprenderla.";
        wasWrong = true;
        var pos = Math.min(queue.length, 1 + Math.floor(Math.random() * 2));
        queue.splice(pos, 0, cur);
      }
      save();
      updateHud();
      $("next").disabled = false;
    }

    $("next").onclick = function () {
      if (remaining() === 0) finish();
      else showQ();
    };
    $("again").onclick = function () {
      mastery = {};
      pts = 0;
      streak = 0;
      queue = [];
      wasWrong = false;
      $("play").classList.remove("hide");
      $("done").classList.remove("show");
      save();
      buildQueue();
      showQ();
    };

    buildQueue();
    showQ();
  } catch (e) {
    var el = document.getElementById("err");
    el.style.display = "block";
    el.textContent = "Error: " + e.message;
  }
})();
</script>
</body>
</html>
